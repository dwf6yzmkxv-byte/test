<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable (404) | MontagneNoireLaser</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#1e1a15">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            background: #1e1a15;
            color: #efe6dc;
            font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            text-align: center;
        }
        main { max-width: 34rem; }
        .code {
            margin: 0;
            font-family: "Playfair Display", Georgia, "Times New Roman", serif;
            font-size: clamp(5rem, 22vw, 9rem);
            font-weight: 700;
            line-height: 1;
            color: #d4a373;
        }
        h1 {
            margin: 1rem 0 0.75rem;
            font-family: "Playfair Display", Georgia, "Times New Roman", serif;
            font-size: clamp(1.6rem, 5vw, 2.25rem);
            color: #fff;
        }
        p { margin: 0 0 1.5rem; color: #cfc5b8; }
        .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
        a.btn {
            display: inline-block;
            padding: 0.9rem 1.75rem;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            border: 2px solid #d4a373;
            transition: background-color .2s, color .2s;
        }
        a.primary { background: #d4a373; color: #1e1a15; }
        a.primary:hover, a.primary:focus-visible { background: #fff; border-color: #fff; }
        a.secondary { color: #d4a373; }
        a.secondary:hover, a.secondary:focus-visible { background: #d4a373; color: #1e1a15; }
        a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        .brand { margin-top: 2.5rem; font-size: 0.85rem; color: #a98467; letter-spacing: 0.15em; text-transform: uppercase; }
    </style>
</head>
<body>
    <main>
        <p class="code" aria-hidden="true">404</p>
        <h1>Cette page est introuvable</h1>
        <p>Le lien que vous avez suivi est peut-être erroné, ou la page a été déplacée. Retrouvez toutes nos gravures laser sur bois et cuir depuis l'accueil.</p>
        <div class="actions">
            <a class="btn primary" href="/">Retour à l'accueil</a>
            <a class="btn secondary" href="/#catalogue">Voir le catalogue</a>
        </div>
        <p class="brand">MontagneNoireLaser · Mazamet, Tarn</p>
    </main>
</body>
</html>
